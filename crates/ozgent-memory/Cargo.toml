[package]
name = "ozgent-memory"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ozgent-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# `bundled` compiles SQLite from source, so ozgent never depends on whatever
# version happens to be installed, and FTS5 is guaranteed present.
rusqlite = { version = "0.37", features = ["bundled"] }

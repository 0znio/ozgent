[package]
name = "ozgent-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ozgent"
path = "src/main.rs"

[dependencies]
ozgent-core.workspace = true
ozgent-hub.workspace = true
ozgent-llama.workspace = true
ozgent-memory.workspace = true
ozgent-render.workspace = true
ozgent-tools.workspace = true
ozgent-web.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
rustyline.workspace = true
ctrlc.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
cuda = ["ozgent-llama/cuda", "ozgent-web/cuda"]
vulkan = ["ozgent-llama/vulkan", "ozgent-web/vulkan"]
metal = ["ozgent-llama/metal", "ozgent-web/metal"]

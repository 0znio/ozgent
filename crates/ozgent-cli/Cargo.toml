[package]
name = "ozgent-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ozgent"
path = "src/main.rs"

[dependencies]
ozgent-core.workspace = true
ozgent-hub.workspace = true
ozgent-llama.workspace = true
ozgent-memory.workspace = true
ozgent-render.workspace = true
ozgent-tools.workspace = true
ozgent-mcp.workspace = true
ozgent-schedule.workspace = true
ozgent-web.workspace = true
ozgent-channels.workspace = true
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
rustyline.workspace = true
ctrlc.workspace = true
# The terminal is a client of the daemon, so it needs an HTTP client. rustls
# rather than native-tls, as everywhere else: no OpenSSL headers to build
# against, so `cargo install ozgent` works on a bare machine.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "charset", "http2"] }
tracing-subscriber.workspace = true

[features]
default = []
cuda = ["ozgent-llama/cuda", "ozgent-web/cuda", "ozgent-channels/cuda"]
vulkan = ["ozgent-llama/vulkan", "ozgent-web/vulkan", "ozgent-channels/vulkan"]
metal = ["ozgent-llama/metal", "ozgent-web/metal", "ozgent-channels/metal"]
